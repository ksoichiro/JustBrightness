plugins {
    id 'fabric-loom'
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly project(':common')
    compileOnly "com.electronwill.night-config:core:${night_config_version}"
    compileOnly "com.electronwill.night-config:toml:${night_config_version}"

    if (project.hasProperty('modmenu_version')) {
        modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    }
}

sourceSets.main {
    java {
        srcDir rootProject.file('common/shared/src/main/java')
    }
}
