neoForge {
    version = neoforge_version
    runs { client { client() } }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
configurations { commonJava { canBeResolved = true }; commonResources { canBeResolved = true } }
dependencies {
    compileOnly project(':common')
    compileOnly "com.electronwill.night-config:core:${night_config_version}"
    compileOnly "com.electronwill.night-config:toml:${night_config_version}"
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}
sourceSets.main {
    java.srcDir minecraft_version in ['1.21.9', '1.21.10']
            ? rootProject.file('neoforge/1.21.11/src/main/java')
            : rootProject.file('neoforge/base/src/main/java')
    java.srcDir rootProject.file('common/shared/src/main/java')
    resources.srcDir rootProject.file('neoforge/1.21.1/src/main/resources')
}
tasks.named('compileJava') { dependsOn configurations.commonJava; source configurations.commonJava }
tasks.named('processResources') {
    dependsOn configurations.commonResources
    from configurations.commonResources
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: mod_version, minecraft_version: minecraft_version, neoforge_version: neoforge_version) }
}
