plugins {
    id 'net.minecraftforge.gradle'
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            // macOS requires -XstartOnFirstThread for GLFW; FG7 does not auto-add it
            // unlike Fabric Loom and ModDevGradle.
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
                jvmArgs '-XstartOnFirstThread'
            }
            // Dev runs load resources from a raw output directory, not a jar, so there is no
            // MANIFEST.MF for Mixin's MixinConfigs discovery to read -- the mixin config must
            // be passed explicitly as a program argument (mirrors what MixinGradle used to
            // inject automatically; verified against Forge's own 1.21.11 MDKExamples
            // mixins-only/fg7 reference project).
            args "--mixin.config=${mod_id}.mixins.json"
        }
        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")

    compileOnly project(':common')
    compileOnly project(':forge-base')
    // Forge ships night-config at runtime, so this is compile-classpath only.
    compileOnly "com.electronwill.night-config:core:${night_config_version}"
    compileOnly "com.electronwill.night-config:toml:${night_config_version}"

    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

sourceSets.main {
    java {
        srcDir rootProject.file('forge/base/src/main/java')
        srcDir rootProject.file('common/shared/src/main/java')
    }
}

tasks.named('compileJava') {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('processResources') {
    dependsOn configurations.commonResources
    from configurations.commonResources

    filesMatching('META-INF/mods.toml') {
        expand(
            version: mod_version,
            minecraft_version: minecraft_version,
            forge_version: forge_version,
        )
    }
}

// Forge's Mixin platform agent (MixinPlatformAgentDefault) discovers mixin configs only via
// the jar's MixinConfigs manifest attribute -- unlike NeoForge, it ignores mods.toml's
// [[mixins]] table entirely, so without this the mixin silently never applies.
tasks.named('jar') {
    manifest {
        attributes(
            'MixinConfigs': 'justbrightness.mixins.json',
        )
    }
}

// Merge resources and classes into the same directory for proper module support
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
