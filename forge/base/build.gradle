plugins {
    id 'net.minecraftforge.gradle'
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")

    compileOnly project(':common')
    // Forge ships night-config at runtime, so this is compile-classpath only.
    compileOnly "com.electronwill.night-config:core:${night_config_version}"
    compileOnly "com.electronwill.night-config:toml:${night_config_version}"
}

sourceSets.main {
    java {
        srcDir rootProject.file('common/shared/src/main/java')
    }
}
