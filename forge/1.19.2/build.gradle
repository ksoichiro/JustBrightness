plugins {
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = forge_version

    runs {
        client {
            client()
            // Development runs load resources directly from the output directory,
            // so the JAR manifest cannot register the Mixin configuration.
            programArgument "--mixin.config=${mod_id}.mixins.json"
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly project(':common')

    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

sourceSets.main {
    java {
        srcDir rootProject.file('common/shared/src/main/java')
    }
}

tasks.named('compileJava') {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('processResources') {
    dependsOn configurations.commonResources
    from configurations.commonResources

    filesMatching('META-INF/mods.toml') {
        expand(
                version: mod_version,
                minecraft_version: minecraft_version,
                forge_version: forge_version,
        )
    }
}

tasks.named('jar') {
    manifest {
        attributes(
                'MixinConfigs': 'justbrightness.mixins.json',
        )
    }
}
