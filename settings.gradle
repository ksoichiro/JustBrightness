pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.architectury.dev/' }
    }

    def targetVer = settings.providers.gradleProperty('target_mc_version').getOrNull()
    plugins {
        if (targetVer == '1.16.5') {
            id 'dev.architectury.loom' version settings.providers.gradleProperty('architectury_loom_version').get()
        } else if (targetVer.startsWith('1.')) {
            id 'fabric-loom' version settings.providers.gradleProperty('fabric_loom_version').get()
            id 'net.minecraftforge.gradle' version settings.providers.gradleProperty('forgegradle_version').get()
        } else {
            id 'net.fabricmc.fabric-loom' version settings.providers.gradleProperty('fabric_loom_26_version').get()
            id 'net.minecraftforge.gradle' version settings.providers.gradleProperty('forgegradle_version').get()
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'JustBrightness'

def targetMcVersion = providers.gradleProperty('target_mc_version').getOrNull()
if (targetMcVersion == null) {
    throw new GradleException("'target_mc_version' property is not defined.")
}

def propsFile = file("props/${targetMcVersion}.properties")
if (!propsFile.exists()) {
    throw new GradleException("props/${targetMcVersion}.properties not found")
}
def versionProps = new Properties()
propsFile.withInputStream { versionProps.load(it) }

gradle.beforeProject { project ->
    versionProps.each { key, value ->
        if (!project.hasProperty(key)) {
            project.ext.set(key, value)
        }
    }
}

def enabledPlatforms = versionProps.getProperty('enabled_platforms', '').split(',').collect { it.trim() }

include 'common'
project(':common').projectDir = file("common/${targetMcVersion}")

enabledPlatforms.each { platform ->
    def platformDir = file("${platform}/${targetMcVersion}")
    def baseDir = file("${platform}/base")
    def buildFile = new File(platformDir, 'build.gradle')
    // Some version families (e.g. the 1.21.x forge/neoforge lines) route their Java sources
    // through a shared gradle/version-builds/*.gradle script instead of depending on the
    // ${platform}-base project directly, so presence/absence of src/main/java isn't a reliable
    // signal here. Only include ${platform}-base when the version's own build.gradle actually
    // depends on it - otherwise it becomes a phantom project that still needs to compile (against
    // whichever API generation ${platform}/base happens to target) despite nothing using its output.
    def usesBase = baseDir.exists() && buildFile.exists() && buildFile.text.contains(":${platform}-base")
    if (usesBase) {
        include "${platform}-base"
        project(":${platform}-base").projectDir = baseDir
    }
    include platform
    project(":${platform}").projectDir = platformDir
}
