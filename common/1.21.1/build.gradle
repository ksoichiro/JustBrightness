plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neoform_version
}

sourceSets.main {
    java {
        srcDir rootProject.file('common/shared/src/main/java')
    }
}

dependencies {
    // Mixin annotations only; both fabric and neoforge already provide a Mixin
    // implementation at runtime (this project only needs the API to compile).
    compileOnly 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
}

configurations {
    commonJava {
        canBeConsumed = true
        canBeResolved = false
    }
    commonResources {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    commonJava sourceSets.main.java.srcDirs.first()
    commonResources sourceSets.main.resources.srcDirs.first()
}
